<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOVA Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #fbbf24;
            --secondary: #f59e0b;
            --accent: #ef4444;
            --bg: #0f172a;
            --text: #f8fafc;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 100%);
            color: var(--text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        #app {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 60px 20px;
        }

        .header {
            text-align: center;
            z-index: 10;
        }

        #main-title {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 20px;
            background: linear-gradient(to right, #fff, var(--primary));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
            animation: fadeIn 1s ease-out;
        }

        .score-container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 24px 48px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #score {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.4));
        }

        .boss-stage {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #vova {
            width: 80vw;
            max-width: 320px;
            height: auto;
            aspect-ratio: 1/1;
            object-fit: contain;
            cursor: pointer;
            filter: drop-shadow(0 40px 80px rgba(0, 0, 0, 0.7));
            transition: transform 0.05s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            -webkit-user-drag: none;
        }

        #vova:active {
            transform: scale(0.8) translateY(15px);
        }

        .burger-particle {
            position: absolute;
            font-size: 3rem;
            pointer-events: none;
            z-index: 100;
            animation: particleFloat 0.8s ease-out forwards;
        }

        @keyframes particleFloat {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 1;
            }

            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.8) rotate(var(--tr));
                opacity: 0;
            }
        }

        .fart-cloud {
            position: absolute;
            bottom: 25%;
            font-size: 5rem;
            pointer-events: none;
            z-index: 2;
            filter: blur(3px);
            animation: fartOut 0.6s ease-out forwards;
        }

        @keyframes fartOut {
            0% {
                transform: scale(0.3) translateY(0);
                opacity: 0;
            }

            30% {
                opacity: 0.7;
            }

            100% {
                transform: scale(3) translateY(100px) rotate(15deg);
                opacity: 0;
            }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-3px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(5px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-8px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(8px, 0, 0);
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .instruction {
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            margin-top: 30px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .footer-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.6;
        }

        #creator-link {
            color: var(--primary);
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.2s;
            font-size: 0.65rem;
        }

        #creator-link:hover {
            opacity: 1;
        }

        /* Top Buttons Layout */
        .top-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            /* Moved to Top Left as requested */
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 15px;
            color: var(--text);
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-btn:active {
            transform: scale(0.95);
        }

        .donate-btn-right {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            border: none;
            padding: 10px 18px;
            border-radius: 15px;
            color: #000;
            font-weight: 900;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 101;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
            animation: starPulse 2s infinite;
        }

        @keyframes starPulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7);
            }

            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 10px rgba(250, 204, 21, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(250, 204, 21, 0);
            }
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            width: 100%;
            max-width: 400px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* Leaderboard Specific */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid transparent;
        }

        .rank-1 {
            border: 2px solid #ffd700 !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .rank-2 {
            border: 2px solid #c0c0c0 !important;
            box-shadow: 0 0 15px rgba(192, 192, 192, 0.2);
        }

        .rank-3 {
            border: 2px solid #cd7f32 !important;
            box-shadow: 0 0 15px rgba(205, 127, 50, 0.2);
        }

        /* Donate Specific */
        .donate-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .donate-option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .donate-option:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
        }

        .star-amount {
            font-size: 1.5rem;
            font-weight: 900;
            display: block;
            margin-bottom: 5px;
            color: #facc15;
        }

        .star-label {
            font-size: 0.7rem;
            opacity: 0.5;
            text-transform: uppercase;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div id="app">
        <button class="top-btn" onclick="openLeaderboard()">
            <span>🏆</span> TOP
        </button>

        <button class="donate-btn-right" onclick="openDonate()">
            <span>⭐</span> DONATE
        </button>

        <div class="header">
            <h1 id="main-title">ЛАБАТАМИЯ ФАРМ</h1>
            <div class="score-container">
                <div id="score">0</div>
                <div style="font-size: 1rem; color: var(--primary); font-weight: 900; letter-spacing: 2px;">BURGERS
                </div>
            </div>
            <div class="instruction">TAP HEAD TO FART</div>
        </div>

        <div class="boss-stage">
            <img src="vova.png" id="vova" alt="VOVA">
        </div>

        <div class="footer-text">
            Ебани жирного на чердаку<br>
            <a href="https://t.me/sociapatik" id="creator-link">CREATOR: @sociapatik</a>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Top Eaters</h2>
                <button class="close-btn" onclick="closeLeaderboard()">✕</button>
            </div>
            <div class="leaderboard-list" id="leaderboard-list">
                <div style="text-align: center; opacity: 0.5;">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Donate Modal -->
    <div id="donate-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Donate Stars</h2>
                <button class="close-btn" onclick="closeDonate()">✕</button>
            </div>
            <p style="text-align: center; opacity: 0.7; font-size: 0.9rem;">Выбери количество ⭐ для поддержки проекта
            </p>
            <div class="donate-grid">
                <div class="donate-option" onclick="sendDonate(10)">
                    <span class="star-amount">10</span>
                    <span class="star-label">Stars</span>
                </div>
                <div class="donate-option" onclick="sendDonate(50)">
                    <span class="star-amount">50</span>
                    <span class="star-label">Stars</span>
                </div>
                <div class="donate-option" onclick="sendDonate(100)">
                    <span class="star-amount">100</span>
                    <span class="star-label">Stars</span>
                </div>
                <div class="donate-option" onclick="sendDonate(500)">
                    <span class="star-amount">500</span>
                    <span class="star-label">Stars</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * ⚠️ ИНСТРУКЦИЯ ПО НАСТРОЙКЕ UPSTASH:
         * 1. Создай аккаунт на https://upstash.com/
         * 2. Создай Redis базу данных.
         * 3. Скопируй "REST URL" и "REST Token" из консоли.
         * 4. Вставь их ниже вместо 'YOUR_UPSTASH_...'
         */
        const UPSTASH_URL = 'https://clear-filly-118043.upstash.io';
        const UPSTASH_TOKEN = 'gQAAAAAAAc0bAAIgcDJjZjAwMTAwNWI2ZDM0M2RjYTI3OTIwNmU4NzFkNzcyNg';
        const SERVER_URL = window.location.origin; // Автоматически подхватит URL после деплоя на Vercel

        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        tg.headerColor = '#0f172a';
        tg.backgroundColor = '#0f172a';

        const user = tg.initDataUnsafe?.user || { id: 'local', first_name: 'Player' };
        const username = user.username || user.first_name || 'Anonymous';

        let count = parseInt(localStorage.getItem('vova_burgers') || '0');
        const scoreEl = document.getElementById('score');
        const vova = document.getElementById('vova');
        const app = document.getElementById('app');
        const leaderboardModal = document.getElementById('leaderboard-modal');
        const donateModal = document.getElementById('donate-modal');
        const leaderboardList = document.getElementById('leaderboard-list');

        scoreEl.innerText = count;

        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        async function syncWithUpstash() {
            if (!UPSTASH_URL || UPSTASH_URL === 'YOUR_UPSTASH_REDIS_REST_URL' || UPSTASH_URL === '') return;

            try {
                const member = username;
                await fetch(`${UPSTASH_URL}/zadd/leaderboard/${count}/${member}`, {
                    headers: { Authorization: `Bearer ${UPSTASH_TOKEN}` }
                });
            } catch (err) {
                console.error('Upstash sync error:', err);
            }
        }

        async function fetchLeaderboard() {
            // Проверка на корректность ключей
            if (!UPSTASH_URL || UPSTASH_URL.includes('YOUR_UPSTASH') || UPSTASH_URL === '') {
                leaderboardList.innerHTML = `
                    <div style="color: #ef4444; text-align: center; padding: 10px;">
                        <p style="font-weight: 900; margin-bottom: 10px;">Ошибка: Upstash не настроен!</p>
                        <p style="font-size: 0.8rem; opacity: 0.7;">Открой код файла и вставь ключи URL и TOKEN от своего Upstash Redis.</p>
                    </div>`;
                return;
            }

            try {
                const response = await fetch(`${UPSTASH_URL}/zrevrange/leaderboard/0/9/WITHSCORES`, {
                    headers: { Authorization: `Bearer ${UPSTASH_TOKEN}` }
                });
                const data = await response.json();
                const result = data.result || [];

                leaderboardList.innerHTML = '';

                if (result.length === 0) {
                    leaderboardList.innerHTML = '<div style="text-align: center; opacity: 0.5;">No scores yet!</div>';
                    return;
                }

                for (let i = 0; i < result.length; i += 2) {
                    const name = result[i];
                    const score = result[i + 1];
                    const rank = (i / 2) + 1;

                    const card = document.createElement('div');
                    card.className = `player-card rank-${rank <= 3 ? rank : 'other'}`;
                    card.innerHTML = `
                        <div class="player-info">
                            <span class="rank">${rank}</span>
                            <span class="player-name">${name}</span>
                        </div>
                        <span class="player-score">${score} 🍔</span>
                    `;
                    leaderboardList.appendChild(card);
                }
            } catch (err) {
                leaderboardList.innerHTML = '<div style="text-align: center; opacity: 0.5;">Error loading leaderboard</div>';
            }
        }

        function openLeaderboard() {
            leaderboardModal.style.display = 'flex';
            fetchLeaderboard();
        }

        function closeLeaderboard() {
            leaderboardModal.style.display = 'none';
        }

        function openDonate() {
            donateModal.style.display = 'flex';
        }

        function closeDonate() {
            donateModal.style.display = 'none';
        }

        async function sendDonate(amount) {
            tg.showPopup({
                title: 'Донат ' + amount + ' ⭐',
                message: 'Хочешь отправить ' + amount + ' звезд на развитие Лабатамии?',
                buttons: [
                    { id: 'confirm', type: 'default', text: 'Оплатить' },
                    { type: 'cancel', text: 'Отмена' }
                ]
            }, async (btnId) => {
                if (btnId === 'confirm') {
                    try {
                        // Запрашиваем ссылку на оплату у нашего сервера (Vercel API)
                        const response = await fetch(`${SERVER_URL}/api/create-invoice?amount=${amount}`);
                        const data = await response.json();
                        
                        if (data.link) {
                            // Открываем окно оплаты Telegram
                            tg.openInvoice(data.link, (status) => {
                                if (status === 'paid') {
                                    tg.showAlert('Оплата прошла успешно! Спасибо за поддержку ❤️');
                                    closeDonate();
                                } else if (status === 'cancelled') {
                                    tg.showAlert('Оплата отменена.');
                                } else {
                                    tg.showAlert('Ошибка при оплате.');
                                }
                            });
                        } else {
                            tg.showAlert('Ошибка: сервер не смог создать инвойс.');
                        }
                    } catch (err) {
                        console.error(err);
                        tg.showAlert('Ошибка связи с сервером. Убедись, что server.js запущен!');
                    }
                }
            });
        }

        function playComicalSounds() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            // SMACK
            const smackOsc = audioCtx.createOscillator();
            const smackGain = audioCtx.createGain();
            smackOsc.type = 'square';
            smackOsc.frequency.setValueAtTime(150, now);
            smackOsc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            smackGain.gain.setValueAtTime(0.3, now);
            smackGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            smackOsc.connect(smackGain);
            smackGain.connect(audioCtx.destination);
            smackOsc.start(now);
            smackOsc.stop(now + 0.1);

            // FART
            const fartOsc = audioCtx.createOscillator();
            const fartGain = audioCtx.createGain();
            const fartFilter = audioCtx.createBiquadFilter();
            fartOsc.type = 'sawtooth';
            const baseFreq = 50 + Math.random() * 40;
            fartOsc.frequency.setValueAtTime(baseFreq, now + 0.05);
            fartOsc.frequency.exponentialRampToValueAtTime(baseFreq / 4, now + 0.4);
            fartFilter.type = 'lowpass';
            fartFilter.frequency.setValueAtTime(400, now);
            fartFilter.Q.setValueAtTime(15, now);
            fartGain.gain.setValueAtTime(0, now);
            fartGain.gain.linearRampToValueAtTime(0.4, now + 0.1);
            fartGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            fartOsc.connect(fartFilter);
            fartFilter.connect(fartGain);
            fartGain.connect(audioCtx.destination);
            fartOsc.start(now + 0.05);
            fartOsc.stop(now + 0.4);
        }

        function createParticle(x, y, emoji, type) {
            const p = document.createElement('div');
            p.className = type;
            p.innerText = emoji;
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            if (type === 'burger-particle') {
                p.style.setProperty('--tx', (Math.random() - 0.5) * 500 + 'px');
                p.style.setProperty('--ty', -400 - Math.random() * 300 + 'px');
                p.style.setProperty('--tr', Math.random() * 1440 + 'deg');
            }
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1000);
        }

        let lastSync = 0;
        function throttledSync() {
            const now = Date.now();
            if (now - lastSync > 5000) {
                syncWithUpstash();
                lastSync = now;
            }
        }

        function handleHit(e) {
            initAudio();
            count++;
            scoreEl.innerText = count;
            localStorage.setItem('vova_burgers', count);
            throttledSync();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
            vova.parentElement.classList.remove('shake');
            void vova.parentElement.offsetWidth;
            vova.parentElement.classList.add('shake');
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            createParticle(x - 25, y - 25, '🍔', 'burger-particle');
            const rect = vova.getBoundingClientRect();
            createParticle(rect.left + rect.width / 2 - 40, rect.bottom - 60, '💨', 'fart-cloud');
            playComicalSounds();
        }

        vova.addEventListener('touchstart', (e) => { e.preventDefault(); handleHit(e); }, { passive: false });
        vova.addEventListener('mousedown', (e) => { if (e.button === 0) handleHit(e); });
        document.getElementById('creator-link').addEventListener('click', (e) => {
            e.preventDefault();
            tg.openTelegramLink('https://t.me/sociapatik');
        });

        setTimeout(syncWithUpstash, 1000);
    </script>
</body>

</html>
